global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "feedr-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: feedr-api
          app: feedr

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]