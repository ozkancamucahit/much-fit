services:
  user-db:
    image: postgres:18.6-alpine3.24
    container_name: much-user-db
    environment:
      - POSTGRES_DB=userservice_dev
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - "5444:5432"
  user-service-api:
    image: user-service:latest
    build:
      context: .
      dockerfile: src/Services/UserService/UserService.Api/Dockerfile
    ports:
      - "8881:8080"


